# Production sur le VPS (Coolify, build pack « Docker Compose », fichier /docker-compose.prod.yml).
#
# Routage par le PROXY DE COOLIFY : dans Coolify, service « app »,
# Domains = https://toodoo.example.com:3000 (le « :3000 » = port du conteneur).
# Coolify ajoute lui-meme les labels Traefik et le certificat HTTPS.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: toodoo
      POSTGRES_USER: toodoo
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}"
    volumes:
      - toodoo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toodoo -d toodoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://toodoo:${POSTGRES_PASSWORD}@db:5432/toodoo?schema=public
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant}"
      PORT: 3000
    expose:
      - "3000"

volumes:
  toodoo_db:

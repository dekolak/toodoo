# Deploiement production via Coolify. Le proxy Coolify (Traefik) gere
# le routage HTTPS et les domaines.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toodoo}
      POSTGRES_USER: ${POSTGRES_USER:-toodoo}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}"
    volumes:
      - toodoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toodoo} -d ${POSTGRES_DB:-toodoo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-toodoo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-toodoo}?schema=public
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3000
      CORS_ORIGIN: "${CORS_ORIGIN:?CORS_ORIGIN manquant}"

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:?VITE_API_URL manquant}"
    restart: unless-stopped
    depends_on:
      - api

volumes:
  toodoo_db_data:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toodoo}
      POSTGRES_USER: ${POSTGRES_USER:-toodoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toodoo}
    ports:
      - "5432:5432"
    volumes:
      - toodoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toodoo} -d ${POSTGRES_DB:-toodoo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  toodoo_db_data:

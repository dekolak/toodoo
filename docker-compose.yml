# Developpement local : juste la base de donnees.
# Production : utiliser docker-compose.prod.yml (Coolify).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: toodoo
      POSTGRES_USER: toodoo
      POSTGRES_PASSWORD: toodoo
    ports:
      - "5432:5432"
    volumes:
      - toodoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toodoo -d toodoo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  toodoo_db_data:
